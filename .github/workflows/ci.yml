name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Bash regression suite
        run: bash tests/run.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run PowerShell regression suite
        shell: pwsh
        run: ./tests/run.ps1
